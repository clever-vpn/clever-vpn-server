name: Test Install Script

# 这个 workflow 断言的是**公开仓的对外契约**（资产命名、校验文件格式、脚本入口），
# 所以它住在公开仓（= 文档 + 发布载体）。
#
# 定位：它是「发布产物契约测试」，不是「安装功能测试」—— CI=true 会跳过
# BTF/WireGuard 检查与 `clever-vpn install`。所以它与手工 RC 验证互补、不重叠：
#   - 这里（免费、发版即可跑）→ 下载/校验契约、四个架构齐全、生产调用形式能跑通
#   - 手工 RC（真机）        → 二进制在真实内核上能否工作（BPF / WireGuard / systemd）
#
# 触发：
#   ① 手工 workflow_dispatch（tag 必填 —— 刻意不给默认值，避免又拿旧版本跑一遍）
#   ② 由私有仓 clever-vpn-server-src 的 release workflow 在发布后经 API 触发
#      （POST /repos/clever-vpn/clever-vpn-server/actions/workflows/test-install.yml/dispatches，
#      需要 PAT 具备 workflow scope）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to test (e.g. v2.1.11)'
        required: true
        type: string

permissions:
  contents: read

env:
  # 生产环境的脚本入口（与 cf-api 生成的安装命令一致）
  INSTALL_URL: https://github.com/clever-vpn/clever-vpn-server/raw/main/install.sh
  # 发布资产基址（= 老机器的升级源，形状不允许变）
  ASSET_BASE: https://github.com/clever-vpn/clever-vpn-server/releases/download
  # 发布资产镜像（主源）；key 形状 = <R2_PREFIX>/<TAG>/<asset>
  R2_PUBLIC_BASE: https://download.clever-vpn.org
  R2_PREFIX: vpn-server

jobs:
  contract:
    name: Asset contract (all 4 arches)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # 矩阵只覆盖 amd64/arm64，这里补齐 arm/386 —— 少发一个架构的资产
      # 真机 RC 是发现不了的（RC 用手工 scp 的本地文件，不碰下载）。
      - name: All published assets exist
        run: |
          set -euo pipefail
          base="$ASSET_BASE/$TAG"
          missing=0
          for arch in 386 amd64 arm arm64; do
            for ext in gz sha256; do
              url="$base/clever-vpn-server-${arch}-${TAG}.${ext}"
              code=$(curl -sSL -I -o /dev/null -w '%{http_code}' "$url")
              echo "${arch}.${ext} -> ${code}"
              if [ "$code" != "200" ]; then
                echo "::error::missing release asset: clever-vpn-server-${arch}-${TAG}.${ext}"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ]

      - name: Checksum file is well-formed
        run: |
          set -euo pipefail
          curl -fsSL "$ASSET_BASE/$TAG/clever-vpn-server-amd64-${TAG}.sha256" -o /tmp/checksum.sha256
          if ! grep -Eq '^[0-9a-f]{64} +[^ ]+$' /tmp/checksum.sha256; then
            echo "::error::malformed checksum file: $(cat /tmp/checksum.sha256)"
            exit 1
          fi
          echo "OK: $(cat /tmp/checksum.sha256)"

  # R2 镜像 —— 【提示，不作门禁】
  #
  # ⚠️ CI 的出口是 GitHub runner（云厂商 IP 段）。2026-09-28 实测同一个对象 URL：
  #      家宽 200 / **真实 VPS 200** / runner **403** —— 被公开域名的边缘策略挡了。
  #    所以这个 job 在 CI 里**无法**证明"安装机能取到"，把它当门禁等于永远红。
  #
  # 权威的"镜像 == GitHub"校验在私有仓的 push-to-r2.yml：它用凭证从 R2 取回对象
  # 再逐字节比对（不碰公网边缘）。这里保留是为了：
  #   · 一旦边缘策略允许 CI，它自动变成有效证据；
  #   · 不允许时，它把真实状态与原因写清楚，而不是让人猜。
  # 内容不一致（真问题）本步骤会以非零退出：不用 continue-on-error，由脚本自己决定。
  r2-mirror:
    name: R2 mirror reachability (advisory)
    needs: contract
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: R2 public reachability and content match
        run: |
          set -uo pipefail
          gh_base="$ASSET_BASE/$TAG"
          r2_base="$R2_PUBLIC_BASE/$R2_PREFIX/$TAG"
          blocked=0
          mismatch=0

          for arch in 386 amd64 arm arm64; do
            url="$r2_base/clever-vpn-server-${arch}-${TAG}.gz"
            code=$(curl -sSL -I -o /dev/null -m 30 -w '%{http_code}' "$url" || true)
            echo "r2 ${arch}.gz -> ${code:-<transport error>}"
            if [ "${code:-}" != "200" ]; then
              blocked=1
            fi

            # .sha256 内容小，直接逐字节比对 —— 它装的是**解压后二进制**的摘要，
            # 两边内容一致即证明两边发布的是同一个编译产物
            f="clever-vpn-server-${arch}-${TAG}.sha256"
            if ! curl -fsSL "$gh_base/$f" -o "/tmp/gh-$f" 2>/dev/null; then
              echo "::warning::GitHub 侧取不到 $f"
              mismatch=1
              continue
            fi
            if ! curl -fsSL "$r2_base/$f" -o "/tmp/r2-$f" 2>/dev/null; then
              blocked=1
              continue
            fi
            if ! cmp -s "/tmp/gh-$f" "/tmp/r2-$f"; then
              echo "::error::R2 checksum file differs from GitHub: $f"
              mismatch=1
            fi
          done

          # 内容不一致 = 真问题（不管谁能取到），必须红
          if [ "$mismatch" -ne 0 ]; then
            exit 1
          fi

          if [ "$blocked" -ne 0 ]; then
            echo "::warning::CI runner 取不到公开域名（边缘策略拦截）。这不代表线上有问题："
            echo "::warning::真实 VPS 实测 200。权威校验见私有仓 push-to-r2.yml 的桶内比对。"
            exit 0
          fi
          echo "OK: R2 public edge serves the same assets as GitHub for $TAG"

  install:
    name: Install (${{ matrix.arch }}) on ${{ matrix.runner }}
    needs: contract
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      CI: 'true'
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 生产的真实调用形式：@ 是 $0 占位符，TAG/TOKEN 才落在 $1/$2 上。
      # 这条路径此前从未被任何测试走过。
      - name: Deployed entry point (production invocation form)
        run: |
          set -eux
          bash -c "$(curl -fsSL "$INSTALL_URL")" @ "$TAG" "test-token-not-used"

      # 本地旁路：不起下载，直接装本地 .gz（手工 RC 验证用的就是这条路径）
      - name: Local artifact (--local-file)
        run: |
          set -eux
          workdir="$(mktemp -d)"
          cd "$workdir"
          gz="clever-vpn-server-${{ matrix.arch }}-${TAG}.gz"
          sha="clever-vpn-server-${{ matrix.arch }}-${TAG}.sha256"
          curl -fsSL "$ASSET_BASE/$TAG/$gz"  -o "$gz"
          curl -fsSL "$ASSET_BASE/$TAG/$sha" -o "$sha"
          bash "$GITHUB_WORKSPACE/install.sh" "$TAG" --local-file "./$gz"
